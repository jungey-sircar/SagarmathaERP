
name: Count Lines of Code

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  count-loc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Count lines of code
        run: |
          cloc . \
            --exclude-dir=.git,node_modules,venv,.venv,dist,build
